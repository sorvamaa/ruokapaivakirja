<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ruokapäiväkirja</title>
  <link rel="manifest" href="/static/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #16a34a; --green-light: #dcfce7; --green-dark: #15803d;
      --orange: #ea580c; --blue: #2563eb; --blue-light: #dbeafe;
      --purple: #7c3aed; --purple-light: #ede9fe;
      --bg: #f9fafb; --card: #ffffff; --text: #111827;
      --muted: #6b7280; --border: #e5e7eb; --radius: 14px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; }

    /* Header */
    header { background: var(--green); color: #fff; padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    .date-nav { display: flex; align-items: center; gap: 6px; }
    .date-nav button { background: rgba(255,255,255,.2); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .date-nav span { font-size: .82rem; font-weight: 600; min-width: 52px; text-align: center; }

    /* Tabs */
    nav.tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; }
    nav.tabs button { flex: 1; min-width: 70px; padding: 11px 4px; border: none; background: none; font-size: .78rem; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
    nav.tabs button.active { color: var(--green); border-bottom-color: var(--green); }

    main { flex: 1; padding: 14px; max-width: 560px; width: 100%; margin: 0 auto; }

    /* Summary card */
    .summary-card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .summary-card h2 { font-size: .75rem; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; letter-spacing: .5px; }
    .macro-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .macro { flex: 1; text-align: center; background: var(--green-light); border-radius: 10px; padding: 8px 4px; }
    .macro .value { font-size: 1.1rem; font-weight: 700; color: var(--green-dark); }
    .macro .label { font-size: .65rem; color: var(--muted); margin-top: 1px; }
    .macro.kcal .value { color: var(--orange); }
    .macro.kcal { background: #fff7ed; }

    /* Progress bars */
    .progress-section { display: flex; flex-direction: column; gap: 5px; }
    .progress-row { display: flex; align-items: center; gap: 8px; }
    .progress-row .plabel { font-size: .7rem; color: var(--muted); width: 56px; flex-shrink: 0; }
    .progress-bar { flex: 1; height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-bar .fill { height: 100%; border-radius: 4px; transition: width .4s; }
    .progress-row .pval { font-size: .68rem; color: var(--muted); width: 42px; text-align: right; flex-shrink: 0; }
    .fill.kcal { background: var(--orange); }
    .fill.prot { background: var(--blue); }
    .fill.carb { background: #f59e0b; }
    .fill.fat  { background: #ec4899; }
    .fill.fib  { background: var(--green); }

    /* Meal card */
    .meal-card { background: var(--card); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 1px 4px rgba(0,0,0,.06); cursor: pointer; position: relative; }
    .meal-card:active { opacity: .85; }
    .meal-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    .meal-no-img { width: 64px; height: 64px; border-radius: 10px; background: var(--green-light); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
    .meal-info { flex: 1; min-width: 0; }
    .meal-info .time { font-size: .72rem; color: var(--muted); margin-bottom: 2px; }
    .meal-info .desc { font-size: .88rem; font-weight: 600; margin-bottom: 5px; line-height: 1.3; }
    .meal-info .macros { display: flex; gap: 5px; flex-wrap: wrap; }
    .meal-info .macros span { font-size: .68rem; background: var(--green-light); color: var(--green-dark); border-radius: 5px; padding: 2px 6px; font-weight: 600; }
    .meal-info .macros span.kcal-badge { background: #fff7ed; color: var(--orange); }
    .delete-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: .9rem; padding: 4px; border-radius: 50%; line-height: 1; }
    .delete-btn:hover { color: #dc2626; background: #fee2e2; }

    /* Add meal area */
    .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .add-row button { flex: 1; padding: 13px 8px; border: none; border-radius: var(--radius); font-size: .88rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .btn-camera { background: var(--green); color: #fff; box-shadow: 0 2px 8px rgba(22,163,74,.3); }
    .btn-manual { background: var(--blue-light); color: var(--blue); }
    #file-input { display: none; }

    /* Preview */
    .preview-wrap { display: none; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .preview-wrap.visible { display: flex; }
    .preview-wrap img { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius); }
    .btn-confirm { padding: 13px; background: var(--orange); color: #fff; border: none; border-radius: var(--radius); font-size: .95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-confirm:disabled { opacity: .6; cursor: not-allowed; }
    .btn-cancel { padding: 11px; background: var(--border); color: var(--text); border: none; border-radius: var(--radius); font-size: .88rem; font-weight: 600; cursor: pointer; }

    /* Manual entry */
    .manual-form { display: none; background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .manual-form.visible { display: block; }
    .manual-form textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: .9rem; font-family: inherit; resize: none; height: 80px; margin-bottom: 10px; }
    .manual-form textarea:focus { outline: none; border-color: var(--green); }
    .manual-actions { display: flex; gap: 8px; }
    .manual-actions .btn-confirm { flex: 1; }
    .manual-actions .btn-cancel { flex: 0 0 auto; padding: 11px 18px; }

    /* Spinner */
    .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 20px; border-radius: 24px; font-size: .875rem; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; max-width: 90vw; text-align: center; z-index: 999; }
    .toast.show { opacity: 1; }

    /* Empty */
    .empty { text-align: center; color: var(--muted); padding: 36px 16px; font-size: .88rem; }
    .empty .em { font-size: 2.2rem; margin-bottom: 8px; }

    /* Weight tab */
    .weight-input-card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .weight-input-card h2 { font-size: .75rem; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; letter-spacing: .5px; }
    .weight-row { display: flex; gap: 8px; align-items: center; }
    .weight-row input { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 1.1rem; font-weight: 700; text-align: center; }
    .weight-row input:focus { outline: none; border-color: var(--green); }
    .weight-row button { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: .9rem; font-weight: 700; cursor: pointer; }
    .weight-list-item { background: var(--card); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .weight-list-item .wdate { font-size: .8rem; color: var(--muted); }
    .weight-list-item .wval { font-size: 1.2rem; font-weight: 700; color: var(--blue); }
    .weight-list-item .wdel { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .9rem; padding: 4px; }

    /* Goals tab */
    .goals-card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .goals-card h2 { font-size: .75rem; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; letter-spacing: .5px; }
    .goal-field { margin-bottom: 12px; }
    .goal-field label { display: block; font-size: .82rem; font-weight: 600; color: var(--text); margin-bottom: 5px; }
    .goal-field input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 1rem; }
    .goal-field input:focus { outline: none; border-color: var(--green); }
    .goals-card .save-btn { width: 100%; padding: 13px; background: var(--green); color: #fff; border: none; border-radius: var(--radius); font-size: .95rem; font-weight: 700; cursor: pointer; margin-top: 4px; }

    /* History tab */
    .history-day { background: var(--card); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.06); cursor: pointer; }
    .history-day .day-label { font-weight: 600; font-size: .88rem; }
    .history-day .day-meta { font-size: .75rem; color: var(--muted); margin-top: 1px; }
    .history-day .day-kcal { font-size: 1.05rem; font-weight: 700; color: var(--orange); }

    /* === MODAL === */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 500; align-items: flex-end; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-height: 92dvh; overflow-y: auto; padding: 20px 16px 32px; }
    .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    .modal-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; display: none; }
    .modal h3 { font-size: .72rem; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; margin-bottom: 8px; margin-top: 14px; }
    /* Description input */
    .modal-desc-input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: .95rem; font-weight: 600; font-family: inherit; margin-bottom: 4px; }
    .modal-desc-input:focus { outline: none; border-color: var(--green); }
    /* Items list */
    .items-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .item-row { display: flex; gap: 6px; align-items: center; }
    .item-row .item-name { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: .88rem; font-family: inherit; }
    .item-row .item-name:focus { outline: none; border-color: var(--green); }
    .item-row .item-weight { width: 72px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 8px; font-size: .88rem; text-align: right; }
    .item-row .item-weight:focus { outline: none; border-color: var(--green); }
    .item-row .item-unit { font-size: .75rem; color: var(--muted); flex-shrink: 0; }
    .item-row .item-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 4px 6px; border-radius: 6px; flex-shrink: 0; }
    .item-row .item-del:hover { color: #dc2626; background: #fee2e2; }
    .add-item-btn { width: 100%; padding: 9px; border: 1.5px dashed var(--border); border-radius: 10px; background: none; color: var(--muted); font-size: .85rem; cursor: pointer; margin-bottom: 4px; }
    .add-item-btn:hover { border-color: var(--green); color: var(--green); }
    /* Recalculate button */
    .recalc-btn { width: 100%; padding: 12px; background: var(--blue); color: #fff; border: none; border-radius: 10px; font-size: .9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .recalc-btn:disabled { opacity: .6; cursor: not-allowed; }
    /* Nutrition result */
    .nutrition-result { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: none; }
    .nutrition-result.visible { display: block; }
    .nutr-row { display: flex; justify-content: space-between; font-size: .85rem; padding: 3px 0; border-bottom: 1px solid var(--border); }
    .nutr-row:last-child { border-bottom: none; }
    .nutr-row .nutr-label { color: var(--muted); }
    .nutr-row .nutr-val { font-weight: 700; }
    /* Actions */
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .save-btn { flex: 1; padding: 12px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-size: .9rem; font-weight: 700; cursor: pointer; }
    .modal-actions .close-btn { padding: 12px 18px; background: var(--border); border: none; border-radius: 10px; font-size: .9rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>🥗 Ruokapäiväkirja</h1>
  <div class="date-nav">
    <button id="prev-day">‹</button>
    <span id="date-label"></span>
    <button id="next-day">›</button>
  </div>
</header>

<nav class="tabs">
  <button class="active" data-tab="today">Tänään</button>
  <button data-tab="history">Historia</button>
  <button data-tab="weight">Paino</button>
  <button data-tab="goals">Tavoitteet</button>
</nav>

<main>
  <!-- ── TODAY ── -->
  <div id="tab-today">
    <div class="summary-card">
      <h2>Päivän yhteenveto</h2>
      <div class="macro-row">
        <div class="macro kcal"><div class="value" id="s-kcal">–</div><div class="label">kcal</div></div>
        <div class="macro"><div class="value" id="s-prot">–</div><div class="label">prot g</div></div>
        <div class="macro"><div class="value" id="s-carb">–</div><div class="label">hiilih. g</div></div>
        <div class="macro"><div class="value" id="s-fat">–</div><div class="label">rasva g</div></div>
        <div class="macro"><div class="value" id="s-fib">–</div><div class="label">kuitu g</div></div>
      </div>
      <div class="progress-section" id="progress-bars"></div>
    </div>

    <div class="add-row">
      <button class="btn-camera" id="open-camera"><span>📷</span> Kuvaa</button>
      <button class="btn-manual" id="open-manual"><span>✏️</span> Kirjaa tekstinä</button>
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment">

    <div class="preview-wrap" id="preview-wrap">
      <img id="preview-img" src="" alt="">
      <button class="btn-confirm" id="confirm-btn">
        <span id="confirm-text">Analysoi ateria</span>
        <div class="spinner" id="spinner"></div>
      </button>
      <button class="btn-cancel" id="cancel-btn">Peruuta</button>
    </div>

    <div class="manual-form" id="manual-form">
      <textarea id="manual-text" placeholder="Esim: 'kaksi kananmunaa ja kaksi viipaletta ruisleipää voilla'"></textarea>
      <div class="manual-actions">
        <button class="btn-confirm" id="manual-confirm">
          <span id="manual-text-btn">Analysoi</span>
          <div class="spinner" id="manual-spinner"></div>
        </button>
        <button class="btn-cancel" id="manual-cancel">Peruuta</button>
      </div>
    </div>

    <div id="meals-list"></div>
  </div>

  <!-- ── HISTORY ── -->
  <div id="tab-history" style="display:none">
    <div id="history-list"></div>
  </div>

  <!-- ── WEIGHT ── -->
  <div id="tab-weight" style="display:none">
    <div class="weight-input-card">
      <h2>Lisää painomerkintä</h2>
      <div class="weight-row">
        <input type="number" id="weight-input" step="0.1" min="30" max="300" placeholder="kg">
        <button id="weight-save">Tallenna</button>
      </div>
    </div>
    <div id="weight-list"></div>
  </div>

  <!-- ── GOALS ── -->
  <div id="tab-goals" style="display:none">
    <div class="goals-card">
      <h2>Päivittäiset tavoitteet</h2>
      <div class="goal-field"><label>Kalorit (kcal)</label><input type="number" id="g-kcal" placeholder="2000"></div>
      <div class="goal-field"><label>Proteiini (g)</label><input type="number" id="g-prot" placeholder="120"></div>
      <div class="goal-field"><label>Hiilihydraatit (g)</label><input type="number" id="g-carb" placeholder="220"></div>
      <div class="goal-field"><label>Rasva (g)</label><input type="number" id="g-fat" placeholder="65"></div>
      <div class="goal-field"><label>Kuitu (g)</label><input type="number" id="g-fib" placeholder="30"></div>
      <button class="save-btn" id="goals-save">Tallenna tavoitteet</button>
    </div>
  </div>
</main>

<!-- ── MEAL MODAL ── -->
<div class="modal-overlay" id="meal-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <img class="modal-img" id="modal-img" src="" alt="">
    <h3>Kuvaus</h3>
    <input class="modal-desc-input" type="text" id="edit-desc" placeholder="Aterian kuvaus">
    <h3>Ruoka-aineet</h3>
    <div class="items-list" id="items-list"></div>
    <button class="add-item-btn" id="add-item-btn">+ Lisää ruoka-aine</button>
    <button class="recalc-btn" id="recalc-btn">
      <span id="recalc-text">🔄 Laske ravintoarvot uudelleen</span>
      <div class="spinner" id="recalc-spinner"></div>
    </button>
    <div class="nutrition-result" id="nutrition-result">
      <div class="nutr-row"><span class="nutr-label">Kalorit</span><span class="nutr-val" id="nr-kcal">–</span></div>
      <div class="nutr-row"><span class="nutr-label">Proteiini</span><span class="nutr-val" id="nr-prot">–</span></div>
      <div class="nutr-row"><span class="nutr-label">Hiilihydraatit</span><span class="nutr-val" id="nr-carb">–</span></div>
      <div class="nutr-row"><span class="nutr-label">Rasva</span><span class="nutr-val" id="nr-fat">–</span></div>
      <div class="nutr-row"><span class="nutr-label">Kuitu</span><span class="nutr-val" id="nr-fib">–</span></div>
    </div>
    <div class="modal-actions">
      <button class="save-btn" id="modal-save">Tallenna</button>
      <button class="close-btn" id="modal-close">Sulje</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let currentDate = new Date(); currentDate.setHours(0,0,0,0);
let pendingImageB64 = null;
let pendingMediaType = null;
let goals = {};
let openMealId = null;

// ── Utils ─────────────────────────────────────────────────────────────────────
function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function localIso() {
  return new Date().toLocaleString('sv-SE').replace(' ', 'T');
}
function fmtDate(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return 'Tänään';
  if (diff === -1) return 'Eilen';
  return d.toLocaleDateString('fi-FI', { day:'numeric', month:'short' });
}
function fmtTime(s) {
  return new Date(s).toLocaleTimeString('fi-FI', { hour:'2-digit', minute:'2-digit' });
}
function n(v, unit='') { return v != null ? v + unit : '–'; }
function toast(msg, dur=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ── Date nav ──────────────────────────────────────────────────────────────────
function updateDateLabel() {
  document.getElementById('date-label').textContent = fmtDate(currentDate);
  const today = new Date(); today.setHours(0,0,0,0);
  document.getElementById('next-day').disabled = currentDate >= today;
}
document.getElementById('prev-day').onclick = () => {
  currentDate = new Date(+currentDate - 86400000);
  updateDateLabel(); loadDay();
};
document.getElementById('next-day').onclick = () => {
  const today = new Date(); today.setHours(0,0,0,0);
  if (currentDate < today) { currentDate = new Date(+currentDate + 86400000); updateDateLabel(); loadDay(); }
};

// ── Tabs ──────────────────────────────────────────────────────────────────────
const tabs = ['today','history','weight','goals'];
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tabs.forEach(t => document.getElementById('tab-'+t).style.display = t===btn.dataset.tab ? '' : 'none');
    if (btn.dataset.tab === 'history') loadHistory();
    if (btn.dataset.tab === 'weight') loadWeight();
    if (btn.dataset.tab === 'goals') loadGoals();
  };
});

// ── Camera ────────────────────────────────────────────────────────────────────
document.getElementById('open-camera').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  pendingMediaType = 'image/jpeg';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
        else { w = Math.round(w*MAX/h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.82);
      pendingImageB64 = compressed.split(',')[1];
      document.getElementById('preview-img').src = compressed;
      document.getElementById('preview-wrap').classList.add('visible');
      document.getElementById('open-camera').closest('.add-row').style.display = 'none';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

function cancelPreview() {
  pendingImageB64 = null;
  document.getElementById('preview-wrap').classList.remove('visible');
  document.getElementById('open-camera').closest('.add-row').style.display = '';
}
document.getElementById('cancel-btn').onclick = cancelPreview;

document.getElementById('confirm-btn').onclick = async () => {
  if (!pendingImageB64) return;
  setLoading('confirm-btn', 'confirm-text', 'spinner', true, 'Analysoidaan…');
  try {
    const resp = await fetch('/api/meals', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ image_b64: pendingImageB64, media_type: pendingMediaType, eaten_at: localIso() }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Virhe');
    toast('✅ Ateria lisätty!');
    cancelPreview(); loadDay();
  } catch(err) { toast('❌ ' + err.message, 4000); }
  finally { setLoading('confirm-btn', 'confirm-text', 'spinner', false, 'Analysoi ateria'); }
};

// ── Manual entry ──────────────────────────────────────────────────────────────
document.getElementById('open-manual').onclick = () => {
  document.getElementById('manual-form').classList.add('visible');
  document.getElementById('open-camera').closest('.add-row').style.display = 'none';
  document.getElementById('manual-text').focus();
};
document.getElementById('manual-cancel').onclick = () => {
  document.getElementById('manual-form').classList.remove('visible');
  document.getElementById('open-camera').closest('.add-row').style.display = '';
  document.getElementById('manual-text').value = '';
};
document.getElementById('manual-confirm').onclick = async () => {
  const txt = document.getElementById('manual-text').value.trim();
  if (!txt) return;
  setLoading('manual-confirm', 'manual-text-btn', 'manual-spinner', true, 'Analysoidaan…');
  try {
    const resp = await fetch('/api/meals', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text_description: txt, eaten_at: localIso() }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Virhe');
    toast('✅ Ateria lisätty!');
    document.getElementById('manual-cancel').click();
    loadDay();
  } catch(err) { toast('❌ ' + err.message, 4000); }
  finally { setLoading('manual-confirm', 'manual-text-btn', 'manual-spinner', false, 'Analysoi'); }
};

function setLoading(btnId, textId, spinnerId, loading, label) {
  document.getElementById(btnId).disabled = loading;
  document.getElementById(textId).textContent = label;
  document.getElementById(spinnerId).style.display = loading ? 'block' : 'none';
}

// ── Load day ──────────────────────────────────────────────────────────────────
async function loadDay() {
  const day = isoDate(currentDate);
  const [mealsResp, summaryResp] = await Promise.all([
    fetch(`/api/meals?date=${day}`), fetch(`/api/summary?date=${day}`)
  ]);
  const meals = await mealsResp.json();
  const summary = await summaryResp.json();

  document.getElementById('s-kcal').textContent = summary.calories ?? '–';
  document.getElementById('s-prot').textContent = summary.protein_g ?? '–';
  document.getElementById('s-carb').textContent = summary.carbs_g ?? '–';
  document.getElementById('s-fat').textContent  = summary.fat_g ?? '–';
  document.getElementById('s-fib').textContent  = summary.fiber_g ?? '–';

  renderProgressBars(summary);

  const list = document.getElementById('meals-list');
  if (!meals.length) {
    list.innerHTML = `<div class="empty"><div class="em">🍽️</div>Ei aterioita tälle päivälle.</div>`;
    return;
  }
  list.innerHTML = meals.map(m => {
    const imgHtml = m.image_b64
      ? `<img class="meal-thumb" src="data:image/jpeg;base64,${m.image_b64}" alt="">`
      : `<div class="meal-no-img">🍽️</div>`;
    return `
      <div class="meal-card" onclick="openMealModal(${m.id})">
        ${imgHtml}
        <div class="meal-info">
          <div class="time">${fmtTime(m.eaten_at)}</div>
          <div class="desc">${m.description}</div>
          <div class="macros">
            ${m.calories != null ? `<span class="kcal-badge">${m.calories} kcal</span>` : ''}
            ${m.protein_g != null ? `<span>P ${m.protein_g}g</span>` : ''}
            ${m.carbs_g  != null ? `<span>H ${m.carbs_g}g</span>` : ''}
            ${m.fat_g    != null ? `<span>R ${m.fat_g}g</span>` : ''}
            ${m.fiber_g  != null ? `<span>K ${m.fiber_g}g</span>` : ''}
          </div>
        </div>
        <button class="delete-btn" onclick="event.stopPropagation();deleteMeal(${m.id})" title="Poista">✕</button>
      </div>`;
  }).join('');
}

function renderProgressBars(summary) {
  if (!goals.calories) { document.getElementById('progress-bars').innerHTML = ''; return; }
  const bars = [
    { label:'Kalorit', val: summary.calories, goal: goals.calories, cls:'kcal', unit:'kcal' },
    { label:'Proteiini', val: summary.protein_g, goal: goals.protein_g, cls:'prot', unit:'g' },
    { label:'Hiilihydr.', val: summary.carbs_g, goal: goals.carbs_g, cls:'carb', unit:'g' },
    { label:'Rasva', val: summary.fat_g, goal: goals.fat_g, cls:'fat', unit:'g' },
    { label:'Kuitu', val: summary.fiber_g, goal: goals.fiber_g, cls:'fib', unit:'g' },
  ];
  document.getElementById('progress-bars').innerHTML = bars.map(b => {
    const pct = b.goal ? Math.min(100, Math.round(((b.val||0)/b.goal)*100)) : 0;
    return `<div class="progress-row">
      <span class="plabel">${b.label}</span>
      <div class="progress-bar"><div class="fill ${b.cls}" style="width:${pct}%"></div></div>
      <span class="pval">${b.val ?? 0}/${b.goal}${b.unit}</span>
    </div>`;
  }).join('');
}

async function deleteMeal(id) {
  if (!confirm('Poistetaanko ateria?')) return;
  await fetch(`/api/meals/${id}`, { method: 'DELETE' });
  loadDay();
}

// ── Meal modal ────────────────────────────────────────────────────────────────
let pendingNutrition = null; // nutrition from last recalculation

function renderItemsList(items) {
  const list = document.getElementById('items-list');
  list.innerHTML = items.map((it, i) => `
    <div class="item-row" data-index="${i}">
      <input class="item-name" type="text" value="${it.name}" placeholder="Ruoka-aine" oninput="updateItem(${i},'name',this.value)">
      <input class="item-weight" type="number" value="${it.weight_g}" min="0" step="1" oninput="updateItem(${i},'weight_g',parseFloat(this.value)||0)">
      <span class="item-unit">g</span>
      <button class="item-del" onclick="removeItem(${i})" title="Poista">✕</button>
    </div>`).join('');
}

let modalItems = [];

function updateItem(i, field, val) { modalItems[i][field] = val; }
function removeItem(i) { modalItems.splice(i, 1); renderItemsList(modalItems); pendingNutrition = null; document.getElementById('nutrition-result').classList.remove('visible'); }

document.getElementById('add-item-btn').onclick = () => {
  modalItems.push({ name: '', weight_g: 100 });
  renderItemsList(modalItems);
  // focus new item's name field
  const rows = document.querySelectorAll('#items-list .item-row');
  if (rows.length) rows[rows.length-1].querySelector('.item-name').focus();
};

async function openMealModal(id) {
  openMealId = id;
  pendingNutrition = null;
  document.getElementById('nutrition-result').classList.remove('visible');

  const resp = await fetch(`/api/meals?date=${isoDate(currentDate)}`);
  const meals = await resp.json();
  const m = meals.find(x => x.id === id);
  if (!m) return;

  const imgEl = document.getElementById('modal-img');
  if (m.image_b64) { imgEl.src = `data:image/jpeg;base64,${m.image_b64}`; imgEl.style.display = 'block'; }
  else imgEl.style.display = 'none';

  document.getElementById('edit-desc').value = m.description || '';

  // Load items from analysis JSON
  try {
    const a = JSON.parse(m.analysis || '{}');
    modalItems = (a.items || []).map(it => ({ name: it.name || '', weight_g: it.weight_g || 0 }));
  } catch(e) { modalItems = []; }

  // If no items yet (old meal), create a placeholder from description
  if (!modalItems.length && m.description) {
    modalItems = [{ name: m.description, weight_g: 200 }];
  }

  renderItemsList(modalItems);

  // Show current nutrition
  pendingNutrition = { calories: m.calories, protein_g: m.protein_g, carbs_g: m.carbs_g, fat_g: m.fat_g, fiber_g: m.fiber_g };
  showNutrition(pendingNutrition);

  document.getElementById('meal-modal').classList.add('open');
}

function showNutrition(n) {
  if (!n) return;
  document.getElementById('nr-kcal').textContent = n.calories != null ? n.calories + ' kcal' : '–';
  document.getElementById('nr-prot').textContent = n.protein_g != null ? n.protein_g + ' g' : '–';
  document.getElementById('nr-carb').textContent = n.carbs_g   != null ? n.carbs_g   + ' g' : '–';
  document.getElementById('nr-fat').textContent  = n.fat_g     != null ? n.fat_g     + ' g' : '–';
  document.getElementById('nr-fib').textContent  = n.fiber_g   != null ? n.fiber_g   + ' g' : '–';
  document.getElementById('nutrition-result').classList.add('visible');
}

document.getElementById('recalc-btn').onclick = async () => {
  if (!openMealId) return;
  const items = modalItems.filter(it => it.name.trim());
  if (!items.length) { toast('Lisää ensin ruoka-aineita'); return; }

  const btn = document.getElementById('recalc-btn');
  btn.disabled = true;
  document.getElementById('recalc-text').textContent = 'Lasketaan…';
  document.getElementById('recalc-spinner').style.display = 'block';

  try {
    const resp = await fetch(`/api/meals/${openMealId}/recalculate`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ items })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Virhe');
    pendingNutrition = data.analysis;
    // Update description if Claude returned one
    if (data.analysis.description) document.getElementById('edit-desc').value = data.analysis.description;
    showNutrition(data.analysis);
    toast('✅ Ravintoarvot laskettu!');
    loadDay();
  } catch(err) { toast('❌ ' + err.message, 4000); }
  finally {
    btn.disabled = false;
    document.getElementById('recalc-text').textContent = '🔄 Laske ravintoarvot uudelleen';
    document.getElementById('recalc-spinner').style.display = 'none';
  }
};

document.getElementById('modal-close').onclick = () => document.getElementById('meal-modal').classList.remove('open');
document.getElementById('meal-modal').onclick = e => { if (e.target === document.getElementById('meal-modal')) document.getElementById('meal-modal').classList.remove('open'); };

document.getElementById('modal-save').onclick = async () => {
  if (!openMealId) return;
  // Save description + current nutrition (from last recalc or original)
  const n = pendingNutrition || {};
  const body = {
    description: document.getElementById('edit-desc').value,
    calories:  n.calories  ?? null,
    protein_g: n.protein_g ?? null,
    carbs_g:   n.carbs_g   ?? null,
    fat_g:     n.fat_g     ?? null,
    fiber_g:   n.fiber_g   ?? null,
  };
  const resp = await fetch(`/api/meals/${openMealId}`, {
    method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  if (resp.ok) { toast('✅ Tallennettu!'); document.getElementById('meal-modal').classList.remove('open'); loadDay(); }
  else toast('❌ Tallennus epäonnistui');
};

// ── History ───────────────────────────────────────────────────────────────────
async function loadHistory() {
  const resp = await fetch('/api/history');
  const days = await resp.json();
  const list = document.getElementById('history-list');
  if (!days.length) { list.innerHTML = `<div class="empty"><div class="em">📅</div>Ei historiatietoja vielä.</div>`; return; }
  list.innerHTML = days.map(d => `
    <div class="history-day" onclick="jumpToDay('${d.day}')">
      <div>
        <div class="day-label">${new Date(d.day+'T12:00').toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long'})}</div>
        <div class="day-meta">${d.meal_count} ateriaa</div>
      </div>
      <div class="day-kcal">${d.calories ?? '–'} kcal</div>
    </div>`).join('');
}

function jumpToDay(isoStr) {
  currentDate = new Date(isoStr + 'T00:00');
  updateDateLabel();
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab==='today'));
  tabs.forEach(t => document.getElementById('tab-'+t).style.display = t==='today' ? '' : 'none');
  loadDay();
}

// ── Weight ────────────────────────────────────────────────────────────────────
async function loadWeight() {
  const resp = await fetch('/api/weight?days=30');
  const entries = await resp.json();
  const list = document.getElementById('weight-list');
  if (!entries.length) { list.innerHTML = `<div class="empty"><div class="em">⚖️</div>Ei painomerkintöjä vielä.</div>`; return; }
  list.innerHTML = entries.map(e => `
    <div class="weight-list-item">
      <div>
        <div class="wdate">${new Date(e.day+'T12:00').toLocaleDateString('fi-FI',{weekday:'short',day:'numeric',month:'short'})}</div>
      </div>
      <div class="wval">${e.weight_kg} kg</div>
      <button class="wdel" onclick="deleteWeight(${e.id})">✕</button>
    </div>`).join('');
}

document.getElementById('weight-save').onclick = async () => {
  const val = parseFloat(document.getElementById('weight-input').value);
  if (!val || val < 20 || val > 400) { toast('Syötä kelvollinen paino'); return; }
  const resp = await fetch('/api/weight', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ weight_kg: val, weighed_at: localIso() })
  });
  if (resp.ok) { toast('✅ Paino tallennettu!'); document.getElementById('weight-input').value = ''; loadWeight(); }
};

async function deleteWeight(id) {
  if (!confirm('Poistetaanko merkintä?')) return;
  await fetch(`/api/weight/${id}`, { method: 'DELETE' });
  loadWeight();
}

// ── Goals ─────────────────────────────────────────────────────────────────────
async function loadGoals() {
  const resp = await fetch('/api/goals');
  goals = await resp.json();
  document.getElementById('g-kcal').value = goals.calories ?? '';
  document.getElementById('g-prot').value = goals.protein_g ?? '';
  document.getElementById('g-carb').value = goals.carbs_g ?? '';
  document.getElementById('g-fat').value  = goals.fat_g ?? '';
  document.getElementById('g-fib').value  = goals.fiber_g ?? '';
}

document.getElementById('goals-save').onclick = async () => {
  const body = {
    calories:  parseFloat(document.getElementById('g-kcal').value) || null,
    protein_g: parseFloat(document.getElementById('g-prot').value) || null,
    carbs_g:   parseFloat(document.getElementById('g-carb').value) || null,
    fat_g:     parseFloat(document.getElementById('g-fat').value)  || null,
    fiber_g:   parseFloat(document.getElementById('g-fib').value)  || null,
  };
  const resp = await fetch('/api/goals', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  if (resp.ok) { goals = await resp.json(); toast('✅ Tavoitteet tallennettu!'); renderProgressBars({}); }
};

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  await loadGoals();
  updateDateLabel();
  loadDay();
})();
</script>
